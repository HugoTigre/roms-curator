[package]
name = "roms-curator"
version = "0.2.0"
edition = "2021"
license-file = "LICENSE"
description = "Helper utility to manage Sets of ROMs. Currently only works for MAME ROMs."
authors = ["Hugo Tigre"]
readme = "README.md"
homepage = "https://github.com/HugoTigre/roms-curator"
repository = "https://github.com/HugoTigre/roms-curator"
keywords = ["roms", "mame"]
categories = ["command-line-utilities"]
exclude = [".github/", "tests/", "docs/", ".gitignore", ".editorconfig"]

[dependencies]
# logging
log = "0.4"
log4rs = "1.3"
# xml
roxmltree = "0.20"
# utilities
strum = "0.26"
strum_macros = "0.28"
rand = "0.9"
chrono = "0.4"
clap = { version = "4.5", features = ["cargo"] } # arguments
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
indicatif = { version = "0.17", features = ["rayon"] } # progress bar
zip = "9.1"
same-file = "1.0"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.8.2", features = ["html_reports"] } # benchmarks

[profile.bench]
debug = true

[[bench]]
name = "categorize_roms_bench"
harness = false
[[bench]]
name = "copy_roms_bench"
harness = false
