[package]
name = "roms-curator"
version = "0.2.0"
edition = "2021"
license-file = "LICENSE"
description = "Helper utility to manage Sets of ROMs. Currently only works for MAME ROMs."
authors = ["Hugo Tigre"]
readme = "README.md"
homepage = "https://github.com/HugoTigre/roms-curator"
repository = "https://github.com/HugoTigre/roms-curator"
keywords = ["roms", "mame"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    "tests/",
    "docs/",
    "gui/",
    "src-tauri/",
    "package.json",
    "package-lock.json",
    "vite.config.ts",
    "tsconfig.json",
    "tsconfig.node.json",
    "node_modules/",
    ".gitignore",
    ".editorconfig",
]

autobenches = false

[dependencies]
# logging
log = "0.4"
log4rs = "1.3"
# xml
quick-xml = "0.42"
# utilities
strum = "0.28"
strum_macros = "0.28"
chrono = "0.4"
clap = { version = "4.5", features = ["cargo"] } # arguments
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
indicatif = { version = "0.17", features = ["rayon"] } # progress bar
same-file = "1.0"
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = "9.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.10"
criterion = { version = "0.8.2", features = ["html_reports"] } # benchmarks

[profile.bench]
debug = true

[[bench]]
name = "categorize_roms_bench"
harness = false
[[bench]]
name = "plan_roms_bench"
harness = false
[[bench]]
name = "copy_roms_bench"
harness = false
