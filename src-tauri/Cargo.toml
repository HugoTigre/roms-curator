[package]
name = "roms-curator-gui"
version = "0.2.0"
description = "Desktop curator for roms-curator exports"
authors = ["Hugo Tigre"]
edition = "2021"

[lib]
name = "roms_curator_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
roms-curator = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
